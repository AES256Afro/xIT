<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xIT</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5 21 11l-6.5 6.5V13H10a4.5 4.5 0 0 0-4.5 4.5V20H3v-2.5A7 7 0 0 1 10 10.5h4.5V4.5Z"/></svg>
  <h1>xIT</h1>
  <button id="open-options" class="icon-btn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/><path d="m19.4 13-.1-1 2-1.6-2-3.4-2.4 1-1.7-1-.3-2.6h-4l-.3 2.6-1.7 1-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2L2.5 16l2 3.4 2.4-1 1.7 1 .3 2.6h4l.3-2.6 1.7-1 2.4 1 2-3.4-2-1.6.1-1Zm-2 3.3-1.6-.7-2.6 1.5-.2 1.8h-2l-.2-1.8-2.6-1.5-1.7.7-1-1.7 1.5-1.2a8.7 8.7 0 0 1 0-2.8L4.5 9.4l1-1.7 1.7.7 2.6-1.5.2-1.8h2l.2 1.8 2.6 1.5 1.7-.7 1 1.7-1.5 1.2a8.7 8.7 0 0 1 0 2.8l1.5 1.2-1 1.7Z"/></svg>
  </button>
</header>

<section id="perm" class="card warn" hidden>
  <p id="perm-text">This extension needs access to x.com before it can do anything.</p>
  <button id="perm-grant" class="primary">Grant access to x.com</button>
</section>

<section id="current" class="card">
  <div class="row-between">
    <span class="label" id="current-kind">Checking this tab…</span>
    <span class="pill" id="default-pill"></span>
  </div>
  <code id="preview" class="preview">&hellip;</code>
  <div class="actions">
    <button id="copy-default" class="primary" disabled>Copy</button>
    <button id="open-default" class="ghost" disabled>Open</button>
    <button id="copy-clean" class="ghost" disabled>Copy x.com link</button>
  </div>
</section>

<section class="card">
  <label class="label" for="manual">Or paste any tweet link</label>
  <input id="manual" type="url" placeholder="https://x.com/user/status/123…" spellcheck="false" autocomplete="off">
</section>

<section class="card tight">
  <div class="label pad">Copy with</div>
  <div id="list" class="list"></div>
</section>

<section class="card">
  <label class="switch">
    <input type="checkbox" id="t-browse">
    <span>Redirect x.com page loads</span>
  </label>
  <select id="browse-target" class="select"></select>
  <p id="browse-note" class="note"></p>
  <label class="switch">
    <input type="checkbox" id="t-button">
    <span>Button on every tweet</span>
  </label>
  <label class="switch">
    <input type="checkbox" id="t-hijack">
    <span>Rewrite X's own “Copy link”</span>
  </label>
  <label class="switch">
    <input type="checkbox" id="t-strip">
    <span>Strip <code>?s=20&amp;t=…</code> tracking</span>
  </label>
</section>

<div id="status" class="status" role="status" aria-live="polite"></div>

<script src="../lib/redirectors.js"></script>
<script src="../lib/storage.js"></script>
<script src="popup.js"></script>
</body>
</html>
