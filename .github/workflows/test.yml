# Runs on every push and pull request. The unit suite and the syntax check
# need nothing installed. The Chrome suites install Playwright and its
# Chromium for this run only; package.json gains no dependency.
#
# Not here: the Firefox suite, which needs a Firefox with WebDriver BiDi
# extension installs, and the store screenshots, which need a real Chrome.
# Run those on a desktop, as HANDOFF.md describes.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

# Pinned to 24.04: ubuntu-latest moved to 26.04, where Playwright 1.59.1
# cannot install Chromium, and an image that moves under the job breaks it
# again the next time it moves.
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run i18n

  chrome:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright for this run only
        run: |
          npm install --no-save --no-package-lock playwright@1.59.1
          npx playwright install --with-deps chromium
      - run: npm run build -- --no-zip
      - run: npm run test:browser
      - run: npm run test:qol
